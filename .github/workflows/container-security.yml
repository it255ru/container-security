name: Dockerfile Security Scan with SBOM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: write

jobs:
  dockerfile-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # ========== LINTING STAGE ==========
    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        format: json
        output-file: hadolint-results.json
      continue-on-error: true
      
    - name: Check for .dockerignore
      id: dockerignore_check
      run: |
        if [ -f ".dockerignore" ]; then
          echo "dockerignore_exists=true" >> $GITHUB_OUTPUT
        else
          echo "dockerignore_exists=false" >> $GITHUB_OUTPUT
        fi

    # ========== BUILD STAGE ==========
    - name: Try to build Docker image
      id: build
      continue-on-error: true
      run: |
        echo "Attempting to build Docker image..."
        
        # Создаем необходимые файлы если их нет
        mkdir -p html
        if [ ! -f "html/index.html" ]; then
          echo '<!DOCTYPE html><html><head><title>Test</title></head><body><h1>Test Page</h1></body></html>' > html/index.html
        fi
        
        # Пытаемся собрать образ с тегом
        set +e
        docker build -t test-image:latest -t test-image:${{ github.sha }} . > build-output.log 2> build-errors.log
        BUILD_EXIT_CODE=$?
        set -e
        
        echo "=== BUILD OUTPUT ==="  
        cat build-output.log
        echo "=== BUILD ERRORS ==="
        cat build-errors.log
        
        # Всегда создаем JSON с результатами сборки
        if [ $BUILD_EXIT_CODE -eq 0 ]; then
          echo "Docker build successful"
          echo "build_success=true" >> $GITHUB_OUTPUT
          echo '{"success": true, "message": "Build completed successfully"}' > build-results.json
          
          # Получаем информацию об Alpine версии
          ALPINE_VERSION=$(docker run --rm test-image:latest cat /etc/alpine-release 2>/dev/null | tr -d '\r' || echo "unknown")
          echo "alpine_version=$ALPINE_VERSION" >> $GITHUB_OUTPUT
        else
          echo "Docker build failed"
          echo "build_success=false" >> $GITHUB_OUTPUT
          echo "alpine_version=unknown" >> $GITHUB_OUTPUT
          ERROR_MSG=$(head -c 1000 build-errors.log | sed 's/"/\\"/g' || echo "Build failed")
          echo "{\"success\": false, \"error\": \"$ERROR_MSG\"}" > build-results.json
        fi

    # ========== SBOM & SECURITY SCAN STAGE ==========
    - name: Install SBOM and security tools
      if: steps.build.outputs.build_success == 'true'
      run: |
        # Устанавливаем Syft для генерации SBOM
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        
        # Устанавливаем Trivy для сканирования уязвимостей
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        
        # Устанавливаем Grype для сканирования SBOM с fallback
        echo "Installing Grype..."
        if ! curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin; then
          echo "Grype install failed, trying direct download..."
          wget -q https://github.com/anchore/grype/releases/download/v0.74.10/grype_0.74.10_linux_amd64.tar.gz
          tar -xzf grype_0.74.10_linux_amd64.tar.gz
          sudo mv grype /usr/local/bin/
        fi
        
        # Устанавливаем jq для обработки JSON
        sudo apt-get update && sudo apt-get install -y jq
        
    - name: Generate SBOM for final image
      id: sbom_generation
      if: steps.build.outputs.build_success == 'true'
      run: |
        echo "Generating SBOM for final image..."
        
        # Генерируем SBOM с помощью Syft
        syft test-image:latest -o cyclonedx-json > sbom.cyclonedx.json
        
        # Добавляем информацию о скомпилированном Nginx в SBOM
        NGINX_HASH=$(docker run --rm test-image:latest sha256sum /usr/sbin/nginx 2>/dev/null | cut -d' ' -f1 || echo "unknown")
        
        # Исправленная команда jq - более безопасная обработка
        jq '.components += [{
          "type": "application",
          "name": "nginx",
          "version": "1.24.0",
          "purl": "pkg:generic/nginx@1.24.0?download_url=https://nginx.org/download/nginx-1.24.0.tar.gz",
          "hashes": [{"alg": "SHA-256", "content": "'$NGINX_HASH'"}],
          "properties": [
            {"name": "builtFromSource", "value": "true"},
            {"name": "configureOptions", "value": "--with-http_ssl_module"},
            {"name": "hardened", "value": "true"}
          ]
        }]' sbom.cyclonedx.json > sbom-enhanced.json
        
        mv sbom-enhanced.json sbom.cyclonedx.json
        
        # Анализ SBOM
        COMPONENT_COUNT=$(jq '.components | length' sbom.cyclonedx.json)
        ALPINE_COMPONENTS=$(jq '[.components[] | select(.purl != null) | select(.purl | type == "string") | select(.purl | startswith("pkg:apk/alpine"))] | length' sbom.cyclonedx.json)
        
        echo "component_count=$COMPONENT_COUNT" >> $GITHUB_OUTPUT
        echo "alpine_components=$ALPINE_COMPONENTS" >> $GITHUB_OUTPUT
        
        echo "SBOM generated with $COMPONENT_COUNT components ($ALPINE_COMPONENTS Alpine packages)"
      
    - name: Scan SBOM for vulnerabilities with Grype
      id: sbom_scan
      if: steps.build.outputs.build_success == 'true'
      run: |
        echo "Scanning SBOM for vulnerabilities with Grype..."
        
        # Создаем конфиг для игнорирования false-positive CVE
        cat > grype-config.yaml << 'EOF'
        ignore:
          # Игнорируем проблемные CVE в busybox
          - vulnerability: "CVE-2025-46394"
            reason: "Ignore in busybox components"
            
          - vulnerability: "CVE-2024-58251"  
            reason: "Ignore in busybox components"
        EOF
        
        # Используем Grype для сканирования SBOM со всеми severity
        grype sbom:sbom.cyclonedx.json --config grype-config.yaml --output json > sbom-scan-all-severities.json 2>/dev/null || true
        
        # Анализируем результаты сканирования SBOM
        if [ -f sbom-scan-all-severities.json ] && jq -e . sbom-scan-all-severities.json > /dev/null 2>&1; then
          # Получаем все matches
          SBOM_VULN_COUNT=$(jq '.matches // [] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          
          # Считаем по severity
          SBOM_CRITICAL_COUNT=$(jq '[.matches // [] | select(.vulnerability.severity == "Critical")] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          SBOM_HIGH_COUNT=$(jq '[.matches // [] | select(.vulnerability.severity == "High")] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          SBOM_MEDIUM_COUNT=$(jq '[.matches // [] | select(.vulnerability.severity == "Medium")] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          SBOM_LOW_COUNT=$(jq '[.matches // [] | select(.vulnerability.severity == "Low")] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          SBOM_UNKNOWN_COUNT=$(jq '[.matches // [] | select(.vulnerability.severity == "Unknown")] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          SBOM_NONE_COUNT=$(jq '[.matches // [] | select(.vulnerability.severity == "None" or .vulnerability.severity == "" or .vulnerability.severity == null)] | length' sbom-scan-all-severities.json 2>/dev/null || echo "0")
          
          # Реальные уязвимости (все кроме "None")
          SBOM_REAL_VULN_COUNT=$((SBOM_CRITICAL_COUNT + SBOM_HIGH_COUNT + SBOM_MEDIUM_COUNT + SBOM_LOW_COUNT + SBOM_UNKNOWN_COUNT))
          
          echo "sbom_vuln_count=$SBOM_VULN_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_real_vuln_count=$SBOM_REAL_VULN_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_critical_count=$SBOM_CRITICAL_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_high_count=$SBOM_HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_medium_count=$SBOM_MEDIUM_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_low_count=$SBOM_LOW_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_unknown_count=$SBOM_UNKNOWN_COUNT" >> $GITHUB_OUTPUT
          echo "sbom_none_count=$SBOM_NONE_COUNT" >> $GITHUB_OUTPUT
          
          echo "SBOM scan found $SBOM_VULN_COUNT matches ($SBOM_REAL_VULN_COUNT real vulnerabilities)"
          echo "Breakdown - Critical: $SBOM_CRITICAL_COUNT, High: $SBOM_HIGH_COUNT, Medium: $SBOM_MEDIUM_COUNT, Low: $SBOM_LOW_COUNT, Unknown: $SBOM_UNKNOWN_COUNT, None: $SBOM_NONE_COUNT"
          
          # Сохраняем краткий отчет
          if [ "$SBOM_REAL_VULN_COUNT" -gt 0 ]; then
            grype sbom:sbom.cyclonedx.json --config grype-config.yaml --output table > sbom-vulnerabilities.txt
          fi
        else
          echo "sbom_vuln_count=0" >> $GITHUB_OUTPUT
          echo "sbom_real_vuln_count=0" >> $GITHUB_OUTPUT
          echo "sbom_critical_count=0" >> $GITHUB_OUTPUT
          echo "sbom_high_count=0" >> $GITHUB_OUTPUT
          echo "sbom_medium_count=0" >> $GITHUB_OUTPUT
          echo "sbom_low_count=0" >> $GITHUB_OUTPUT
          echo "sbom_unknown_count=0" >> $GITHUB_OUTPUT
          echo "sbom_none_count=0" >> $GITHUB_OUTPUT
          echo "SBOM scan completed - no vulnerabilities found or error in scan"
        fi
      
    - name: Run Trivy vulnerability scan on image (all severities)
      id: trivy_scan
      if: steps.build.outputs.build_success == 'true'
      run: |
        echo "Running Trivy scan with all severities..."
        
        # Запускаем Trivy для всех уровней серьезности
        trivy image --format json --output trivy-results-all-severities.json test-image:latest
        trivy image --format table --output trivy-report.txt test-image:latest
        
        # Анализируем результаты Trivy
        if [ -f "trivy-results-all-severities.json" ] && jq -e . trivy-results-all-severities.json > /dev/null 2>&1; then
          TRIVY_CRITICAL=$(jq '[.Results[0].Vulnerabilities // [] | select(.Severity == "CRITICAL")] | length' trivy-results-all-severities.json 2>/dev/null || echo "0")
          TRIVY_HIGH=$(jq '[.Results[0].Vulnerabilities // [] | select(.Severity == "HIGH")] | length' trivy-results-all-severities.json 2>/dev/null || echo "0")
          TRIVY_MEDIUM=$(jq '[.Results[0].Vulnerabilities // [] | select(.Severity == "MEDIUM")] | length' trivy-results-all-severities.json 2>/dev/null || echo "0")
          TRIVY_LOW=$(jq '[.Results[0].Vulnerabilities // [] | select(.Severity == "LOW")] | length' trivy-results-all-severities.json 2>/dev/null || echo "0")
          TRIVY_UNKNOWN=$(jq '[.Results[0].Vulnerabilities // [] | select(.Severity == "UNKNOWN")] | length' trivy-results-all-severities.json 2>/dev/null || echo "0")
          TRIVY_TOTAL=$((TRIVY_CRITICAL + TRIVY_HIGH + TRIVY_MEDIUM + TRIVY_LOW + TRIVY_UNKNOWN))
          
          echo "trivy_critical_count=$TRIVY_CRITICAL" >> $GITHUB_OUTPUT
          echo "trivy_high_count=$TRIVY_HIGH" >> $GITHUB_OUTPUT
          echo "trivy_medium_count=$TRIVY_MEDIUM" >> $GITHUB_OUTPUT
          echo "trivy_low_count=$TRIVY_LOW" >> $GITHUB_OUTPUT
          echo "trivy_unknown_count=$TRIVY_UNKNOWN" >> $GITHUB_OUTPUT
          echo "trivy_total_count=$TRIVY_TOTAL" >> $GITHUB_OUTPUT
          
          echo "Trivy found: $TRIVY_TOTAL vulnerabilities"
          echo "Breakdown - CRITICAL: $TRIVY_CRITICAL, HIGH: $TRIVY_HIGH, MEDIUM: $TRIVY_MEDIUM, LOW: $TRIVY_LOW, UNKNOWN: $TRIVY_UNKNOWN"
        else
          echo "trivy_critical_count=0" >> $GITHUB_OUTPUT
          echo "trivy_high_count=0" >> $GITHUB_OUTPUT
          echo "trivy_medium_count=0" >> $GITHUB_OUTPUT
          echo "trivy_low_count=0" >> $GITHUB_OUTPUT
          echo "trivy_unknown_count=0" >> $GITHUB_OUTPUT
          echo "trivy_total_count=0" >> $GITHUB_OUTPUT
          echo "Trivy scan completed - no vulnerabilities found"
        fi

    # ========== ANALYSIS & REPORTING STAGE ==========
    - name: Custom Dockerfile analysis
      id: analysis
      env:
        BUILD_SUCCESS: ${{ steps.build.outputs.build_success }}
        ALPINE_VERSION: ${{ steps.build.outputs.alpine_version }}
        DOCKERIGNORE_EXISTS: ${{ steps.dockerignore_check.outputs.dockerignore_exists }}
        SBOM_COMPONENT_COUNT: ${{ steps.sbom_generation.outputs.component_count }}
        SBOM_ALPINE_COMPONENTS: ${{ steps.sbom_generation.outputs.alpine_components }}
        SBOM_REAL_VULN_COUNT: ${{ steps.sbom_scan.outputs.sbom_real_vuln_count }}
        SBOM_CRITICAL_COUNT: ${{ steps.sbom_scan.outputs.sbom_critical_count }}
        SBOM_HIGH_COUNT: ${{ steps.sbom_scan.outputs.sbom_high_count }}
        SBOM_MEDIUM_COUNT: ${{ steps.sbom_scan.outputs.sbom_medium_count }}
        SBOM_LOW_COUNT: ${{ steps.sbom_scan.outputs.sbom_low_count }}
        TRIVY_TOTAL_COUNT: ${{ steps.trivy_scan.outputs.trivy_total_count }}
        TRIVY_CRITICAL_COUNT: ${{ steps.trivy_scan.outputs.trivy_critical_count }}
        TRIVY_HIGH_COUNT: ${{ steps.trivy_scan.outputs.trivy_high_count }}
        TRIVY_MEDIUM_COUNT: ${{ steps.trivy_scan.outputs.trivy_medium_count }}
        TRIVY_LOW_COUNT: ${{ steps.trivy_scan.outputs.trivy_low_count }}
      run: |
        set +e
        
        echo "## Dockerfile Analysis Results" > analysis-results.md
        echo "" >> analysis-results.md
        echo "**Scan date:** $(date)" >> analysis-results.md
        echo "**Commit:** ${{ github.sha }}" >> analysis-results.md
        echo "**Branch:** ${{ github.ref }}" >> analysis-results.md
        echo "**Alpine version:** $ALPINE_VERSION" >> analysis-results.md
        echo "" >> analysis-results.md
        
        # Инициализация счетчиков ДЛЯ DOCKERFILE ISSUES
        DOCKERFILE_ISSUE_COUNT=0
        DOCKERFILE_CRITICAL_COUNT=0
        DOCKERFILE_HIGH_COUNT=0
        DOCKERFILE_MEDIUM_COUNT=0
        DOCKERFILE_LOW_COUNT=0
        
        echo "### Dockerfile Configuration Issues:" >> analysis-results.md
        
        # УНИВЕРСАЛЬНАЯ ПРОВЕРКА NON-ROOT ПОЛЬЗОВАТЕЛЯ
        LAST_USER=$(grep "^USER " Dockerfile | tail -1 2>/dev/null || echo "")
        USER_CREATED=$(grep -E "adduser|useradd|addgroup|groupadd" Dockerfile 2>/dev/null | head -1 || echo "")

        if [[ -n "$LAST_USER" && "$LAST_USER" != "USER root" && "$LAST_USER" != "USER 0" ]]; then
          echo "✅ Non-root пользователь: $LAST_USER" >> analysis-results.md
        elif [ -n "$USER_CREATED" ]; then
          echo "✅ Создан non-root пользователь: $USER_CREATED" >> analysis-results.md
        else
          echo "⚠️ **WARNING**: Не обнаружен non-root пользователь" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_HIGH_COUNT=$((DOCKERFILE_HIGH_COUNT + 1))
        fi
        
        # Другие проверки...
        if grep "ADD" Dockerfile > /dev/null 2>&1; then
          echo "⚠️ **WARNING**: Используется ADD вместо COPY. COPY предпочтительнее для файлов" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_MEDIUM_COUNT=$((DOCKERFILE_MEDIUM_COUNT + 1))
        else
          echo "✅ Используется COPY вместо ADD" >> analysis-results.md
        fi
        
        # Проверка на базовые образы без версий
        BASE_IMAGE=$(grep "^FROM " Dockerfile | head -1)
        if echo "$BASE_IMAGE" | grep -E ":(latest| )" > /dev/null 2>&1 || 
           echo "$BASE_IMAGE" | grep -E "^FROM [^:]+$" > /dev/null 2>&1; then
          echo "⚠️ **WARNING**: Базовый образ без конкретной версии: $BASE_IMAGE" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_MEDIUM_COUNT=$((DOCKERFILE_MEDIUM_COUNT + 1))
        else
          echo "✅ Базовый образ с версией: $BASE_IMAGE" >> analysis-results.md
        fi
        
        # Проверка на curl | bash
        if grep -E "curl.*\|.*bash" Dockerfile > /dev/null 2>&1 || 
           grep -E "wget.*\|.*bash" Dockerfile > /dev/null 2>&1; then
          echo "🚨 **CRITICAL**: Обнаружен опасный паттерн 'curl/wget | bash'. Это угроза безопасности!" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_CRITICAL_COUNT=$((DOCKERFILE_CRITICAL_COUNT + 1))
        else
          echo "✅ Нет опасных паттернов 'curl/wget | bash'" >> analysis-results.md
        fi
        
        # Проверка прав 777
        if grep -E "chmod.*777" Dockerfile > /dev/null 2>&1 || 
           grep -E "777" Dockerfile > /dev/null 2>&1; then
          echo "🚨 **CRITICAL**: Используются права 777 - это серьезная уязвимость безопасности!" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_CRITICAL_COUNT=$((DOCKERFILE_CRITICAL_COUNT + 1))
        else
          echo "✅ Нет опасных прав 777" >> analysis-results.md
        fi
        
        # Проверка на установку пакетов без очистки кеша
        if grep -E "(apt-get|apk|yum|dnf) install" Dockerfile > /dev/null 2>&1 && 
           ! grep -E "(apt-get clean|rm -rf /var/cache/|apk cache clean|yum clean|dnf clean)" Dockerfile > /dev/null 2>&1; then
          echo "⚠️ **WARNING**: Установка пакетов без очистки кеша. Увеличивает размер образа" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_LOW_COUNT=$((DOCKERFILE_LOW_COUNT + 1))
        fi
        
        # Проверка на множественные RUN инструкции
        RUN_COUNT=$(grep -c "^RUN " Dockerfile 2>/dev/null || echo "0")
        if [ "$RUN_COUNT" -gt 5 ]; then
          echo "⚠️ **WARNING**: Много RUN инструкций ($RUN_COUNT). Консолидируйте их для уменьшения слоев" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_LOW_COUNT=$((DOCKERFILE_LOW_COUNT + 1))
        fi
        
        # Проверка на отсутствие .dockerignore
        if [ "$DOCKERIGNORE_EXISTS" = "false" ]; then
          echo "⚠️ **WARNING**: Отсутствует .dockerignore файл. Рекомендуется добавить для уменьшения размера контекста" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_LOW_COUNT=$((DOCKERFILE_LOW_COUNT + 1))
        else
          echo "✅ .dockerignore файл присутствует" >> analysis-results.md
        fi
        
        # Если нет проблем с Dockerfile
        if [ "$DOCKERFILE_ISSUE_COUNT" -eq 0 ]; then
          echo "✅ No Dockerfile configuration issues found" >> analysis-results.md
        fi
        
        # ========== РАЗДЕЛ: SBOM & VULNERABILITY SCAN ==========
        if [ "$BUILD_SUCCESS" = "true" ]; then
          echo "" >> analysis-results.md
          echo "### Security Vulnerability Scan:" >> analysis-results.md
          
          echo "✅ **Software Bill of Materials generated**" >> analysis-results.md
          echo "- **Alpine version:** $ALPINE_VERSION" >> analysis-results.md
          echo "- **Total components:** $SBOM_COMPONENT_COUNT" >> analysis-results.md
          echo "- **Alpine packages:** $SBOM_ALPINE_COMPONENTS" >> analysis-results.md
          echo "- **Nginx:** 1.24.0 (compiled from source)" >> analysis-results.md
          
          # Информация об уязвимостях
          if [ "$SBOM_REAL_VULN_COUNT" -gt 0 ]; then
            echo "⚠️ **Vulnerabilities found:** $SBOM_REAL_VULN_COUNT vulnerabilities detected" >> analysis-results.md
            if [ "$SBOM_CRITICAL_COUNT" -gt 0 ]; then
              echo "  - 🚨 Critical: $SBOM_CRITICAL_COUNT" >> analysis-results.md
            fi
            if [ "$SBOM_HIGH_COUNT" -gt 0 ]; then
              echo "  - 🔴 High: $SBOM_HIGH_COUNT" >> analysis-results.md
            fi
            if [ "$SBOM_MEDIUM_COUNT" -gt 0 ]; then
              echo "  - 🟡 Medium: $SBOM_MEDIUM_COUNT" >> analysis-results.md
            fi
            if [ "$SBOM_LOW_COUNT" -gt 0 ]; then
              echo "  - 🔵 Low: $SBOM_LOW_COUNT" >> analysis-results.md
            fi
            if [ "$SBOM_UNKNOWN_COUNT" -gt 0 ]; then
              echo "  - ⚪ Unknown: $SBOM_UNKNOWN_COUNT" >> analysis-results.md
            fi
          else
            echo "✅ **No vulnerabilities found** in security scan" >> analysis-results.md
          fi
          
          # Информация о Trivy
          if [ "$TRIVY_TOTAL_COUNT" -gt 0 ]; then
            echo "" >> analysis-results.md
            echo "**Trivy Scan:** $TRIVY_TOTAL_COUNT vulnerabilities found" >> analysis-results.md
            if [ "$TRIVY_CRITICAL_COUNT" -gt 0 ]; then
              echo "  - CRITICAL: $TRIVY_CRITICAL_COUNT" >> analysis-results.md
            fi
            if [ "$TRIVY_HIGH_COUNT" -gt 0 ]; then
              echo "  - HIGH: $TRIVY_HIGH_COUNT" >> analysis-results.md
            fi
            if [ "$TRIVY_MEDIUM_COUNT" -gt 0 ]; then
              echo "  - MEDIUM: $TRIVY_MEDIUM_COUNT" >> analysis-results.md
            fi
            if [ "$TRIVY_LOW_COUNT" -gt 0 ]; then
              echo "  - LOW: $TRIVY_LOW_COUNT" >> analysis-results.md
            fi
          fi
        fi
        
        # ВАЖНО: Проверка результатов сборки
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "" >> analysis-results.md
          echo "### Docker Build Results:" >> analysis-results.md
          echo "🚨 **CRITICAL**: Docker image failed to build!" >> analysis-results.md
          DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + 1))
          DOCKERFILE_CRITICAL_COUNT=$((DOCKERFILE_CRITICAL_COUNT + 1))
          
          if [ -f build-results.json ]; then
            if jq -e . build-results.json > /dev/null 2>&1; then
              BUILD_ERROR=$(jq -r '.error // "Build failed but error details are not available"' build-results.json 2>/dev/null)
              echo "Build errors:" >> analysis-results.md
              echo '```' >> analysis-results.md
              echo "$BUILD_ERROR" >> analysis-results.md
              echo '```' >> analysis-results.md
            else
              echo "• Invalid build results JSON format" >> analysis-results.md
              if [ -f build-errors.log ]; then
                echo "Raw build errors:" >> analysis-results.md
                echo '```' >> analysis-results.md
                head -100 build-errors.log >> analysis-results.md
                echo '```' >> analysis-results.md
              fi
            fi
          fi
        else
          echo "" >> analysis-results.md
          echo "### Docker Build Results:" >> analysis-results.md
          echo "✅ Docker image built successfully" >> analysis-results.md
          echo "✅ Docker image saved: test-image.tar.gz" >> analysis-results.md
        fi
        
        # Анализ Hadolint результатов
        HADOLINT_COUNT=0
        if [ -f hadolint-results.json ]; then
          echo "" >> analysis-results.md
          echo "### Dockerfile Linter (Hadolint):" >> analysis-results.md
          
          if jq -e . hadolint-results.json > /dev/null 2>&1; then
            HADOLINT_COUNT=$(jq '. | length' hadolint-results.json 2>/dev/null || echo "0")
            if [ "$HADOLINT_COUNT" -gt 0 ]; then
              jq -r '.[] | "• **\(.level)**: \(.message) (код: \(.code))"' hadolint-results.json 2>/dev/null >> analysis-results.md
              DOCKERFILE_ISSUE_COUNT=$((DOCKERFILE_ISSUE_COUNT + HADOLINT_COUNT))
            else
              echo "✅ No Hadolint issues found" >> analysis-results.md
            fi
          else
            echo "• Invalid Hadolint JSON format" >> analysis-results.md
          fi
        fi
        
        # ОБЩИЙ ИТОГ - ТОЛЬКО DOCKERFILE ISSUES
        TOTAL_DOCKERFILE_ISSUES=$DOCKERFILE_ISSUE_COUNT
        
        echo "" >> analysis-results.md
        echo "---" >> analysis-results.md
        if [ "$TOTAL_DOCKERFILE_ISSUES" -gt 0 ]; then
          echo "**Dockerfile Analysis Summary:** Found $TOTAL_DOCKERFILE_ISSUES configuration issues" >> analysis-results.md
          if [ "$DOCKERFILE_CRITICAL_COUNT" -gt 0 ]; then
            echo "- 🚨 Critical: $DOCKERFILE_CRITICAL_COUNT" >> analysis-results.md
          fi
          if [ "$DOCKERFILE_HIGH_COUNT" -gt 0 ]; then
            echo "- 🔴 High: $DOCKERFILE_HIGH_COUNT" >> analysis-results.md
          fi
          if [ "$DOCKERFILE_MEDIUM_COUNT" -gt 0 ]; then
            echo "- 🟡 Medium: $DOCKERFILE_MEDIUM_COUNT" >> analysis-results.md
          fi
          if [ "$DOCKERFILE_LOW_COUNT" -gt 0 ]; then
            echo "- 🔵 Low: $DOCKERFILE_LOW_COUNT" >> analysis-results.md
          fi
        else
          echo "✅ **Excellent:** No Dockerfile configuration issues found" >> analysis-results.md
        fi
        
        # Отдельно показываем security vulnerabilities
        if [ "$SBOM_REAL_VULN_COUNT" -gt 0 ]; then
          echo "" >> analysis-results.md
          echo "**Security Vulnerabilities:** $SBOM_REAL_VULN_COUNT vulnerabilities detected in packages" >> analysis-results.md
        else
          echo "" >> analysis-results.md
          echo "**Security Status:** ✅ No vulnerabilities detected" >> analysis-results.md
        fi
        
        # Выходные переменные
        echo "dockerfile_issue_count=$TOTAL_DOCKERFILE_ISSUES" >> $GITHUB_OUTPUT
        echo "dockerfile_critical_count=$DOCKERFILE_CRITICAL_COUNT" >> $GITHUB_OUTPUT
        echo "dockerfile_high_count=$DOCKERFILE_HIGH_COUNT" >> $GITHUB_OUTPUT
        echo "dockerfile_medium_count=$DOCKERFILE_MEDIUM_COUNT" >> $GITHUB_OUTPUT
        echo "dockerfile_low_count=$DOCKERFILE_LOW_COUNT" >> $GITHUB_OUTPUT
        
        echo "sbom_real_vuln_count=$SBOM_REAL_VULN_COUNT" >> $GITHUB_OUTPUT
        echo "sbom_critical_count=$SBOM_CRITICAL_COUNT" >> $GITHUB_OUTPUT
        echo "sbom_high_count=$SBOM_HIGH_COUNT" >> $GITHUB_OUTPUT
        echo "sbom_medium_count=$SBOM_MEDIUM_COUNT" >> $GITHUB_OUTPUT
        echo "sbom_low_count=$SBOM_LOW_COUNT" >> $GITHUB_OUTPUT
        
        echo "✅ Analysis completed with $TOTAL_DOCKERFILE_ISSUES Dockerfile issues and $SBOM_REAL_VULN_COUNT vulnerabilities"

    # ========== SECURITY GATES ==========
    - name: Check security gates
      id: security_gates
      if: always()
      env:
        BUILD_SUCCESS: ${{ steps.build.outputs.build_success }}
        DOCKERFILE_CRITICAL_COUNT: ${{ steps.analysis.outputs.dockerfile_critical_count }}
        SBOM_CRITICAL_COUNT: ${{ steps.analysis.outputs.sbom_critical_count }}
        SBOM_HIGH_COUNT: ${{ steps.analysis.outputs.sbom_high_count }}
      run: |
        echo "🔒 Checking security gates..."
        
        if [ "$BUILD_SUCCESS" = "false" ]; then
          echo "❌ Alpine Docker build failed - failing workflow"
          echo "security_gates_passed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        if [ "$DOCKERFILE_CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ Critical Dockerfile issues found: $DOCKERFILE_CRITICAL_COUNT - failing workflow"
          echo "security_gates_passed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        if [ "$SBOM_CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ Critical vulnerabilities found: $SBOM_CRITICAL_COUNT - failing workflow"
          echo "security_gates_passed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        echo "✅ Alpine security gates passed"
        echo "security_gates_passed=true" >> $GITHUB_OUTPUT

    # ========== ARTIFACT PUBLISHING STAGE ==========
    - name: Save Docker image as artifact
      if: steps.build.outputs.build_success == 'true'
      run: |
        echo "Saving Docker image as artifact..."
        docker save test-image:latest -o test-image.tar
        gzip test-image.tar

    - name: Upload Docker image artifact
      if: steps.build.outputs.build_success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ github.sha }}
        path: test-image.tar.gz
        retention-days: 30
        
    - name: Upload SBOM artifact
      if: steps.build.outputs.build_success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sbom-cyclonedx-${{ github.sha }}
        path: |
          sbom.cyclonedx.json
          sbom-scan-all-severities.json
          sbom-vulnerabilities.txt
        retention-days: 90
        
    - name: Upload scan reports artifact
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-${{ github.sha }}
        path: |
          analysis-results.md
          hadolint-results.json
          trivy-results-all-severities.json
          trivy-report.txt
          build-results.json
        retention-days: 90

    # ========== NOTIFICATION STAGE ==========
    - name: Create or Update Issue with Attachments
      uses: actions/github-script@v6
      if: steps.analysis.outputs.dockerfile_issue_count > 0 || steps.analysis.outputs.sbom_real_vuln_count > 0 || steps.build.outputs.build_success == 'false'
      env:
        DOCKERFILE_ISSUE_COUNT: ${{ steps.analysis.outputs.dockerfile_issue_count }}
        DOCKERFILE_CRITICAL_COUNT: ${{ steps.analysis.outputs.dockerfile_critical_count }}
        BUILD_SUCCESS: ${{ steps.build.outputs.build_success }}
        ALPINE_VERSION: ${{ steps.build.outputs.alpine_version }}
        SBOM_REAL_VULN_COUNT: ${{ steps.analysis.outputs.sbom_real_vuln_count }}
        SBOM_CRITICAL_COUNT: ${{ steps.analysis.outputs.sbom_critical_count }}
        SBOM_HIGH_COUNT: ${{ steps.analysis.outputs.sbom_high_count }}
        SBOM_MEDIUM_COUNT: ${{ steps.analysis.outputs.sbom_medium_count }}
        SBOM_LOW_COUNT: ${{ steps.analysis.outputs.sbom_low_count }}
        TRIVY_TOTAL_COUNT: ${{ steps.trivy_scan.outputs.trivy_total_count }}
        TRIVY_CRITICAL_COUNT: ${{ steps.trivy_scan.outputs.trivy_critical_count }}
        TRIVY_HIGH_COUNT: ${{ steps.trivy_scan.outputs.trivy_high_count }}
        TRIVY_MEDIUM_COUNT: ${{ steps.trivy_scan.outputs.trivy_medium_count }}
        TRIVY_LOW_COUNT: ${{ steps.trivy_scan.outputs.trivy_low_count }}
      with:
        script: |
          const fs = require('fs');
          const report = fs.existsSync('analysis-results.md') 
            ? fs.readFileSync('analysis-results.md', 'utf8')
            : '## Dockerfile Analysis Results\n\nAnalysis results not available.';
          
          const dockerfileIssueCount = parseInt(process.env.DOCKERFILE_ISSUE_COUNT) || 0;
          const dockerfileCriticalCount = parseInt(process.env.DOCKERFILE_CRITICAL_COUNT) || 0;
          const buildSuccess = process.env.BUILD_SUCCESS;
          const alpineVersion = process.env.ALPINE_VERSION || 'unknown';
          
          // ПАРСИМ Grype результаты НАПРЯМУЮ из JSON
          let grypeVulnerabilities = [];
          let vulnerabilityBreakdown = {
            Critical: 0,
            High: 0,
            Medium: 0,
            Low: 0,
            Unknown: 0,
            None: 0
          };
          
          try {
            if (fs.existsSync('sbom-scan-all-severities.json')) {
              const grypeData = JSON.parse(fs.readFileSync('sbom-scan-all-severities.json', 'utf8'));
              
              if (grypeData.matches && Array.isArray(grypeData.matches)) {
                grypeVulnerabilities = grypeData.matches;
                
                // Считаем по severity
                grypeVulnerabilities.forEach(match => {
                  const severity = match.vulnerability?.severity || 'Unknown';
                  if (vulnerabilityBreakdown[severity] !== undefined) {
                    vulnerabilityBreakdown[severity]++;
                  } else {
                    vulnerabilityBreakdown.Unknown++;
                  }
                });
                
                console.log(`Parsed ${grypeVulnerabilities.length} vulnerabilities from Grype results`);
                console.log('Breakdown:', vulnerabilityBreakdown);
              }
            }
          } catch (error) {
            console.log('Error parsing Grype results:', error.message);
          }
          
          const realVulnerabilities = vulnerabilityBreakdown.Critical + vulnerabilityBreakdown.High + 
                                    vulnerabilityBreakdown.Medium + vulnerabilityBreakdown.Low + 
                                    vulnerabilityBreakdown.Unknown;
          
          // Определяем заголовок на основе РЕАЛЬНЫХ данных
          let title;
          let labels = ['dockerfile-security', 'security', 'ci-cd', 'automated'];
          
          if (buildSuccess === 'false') {
            title = `🚨 Docker Build Failed: ${dockerfileIssueCount} configuration issues found`;
            labels.push('build-failed', 'critical');
          } else if (vulnerabilityBreakdown.Critical > 0) {
            title = `🚨 CRITICAL: ${vulnerabilityBreakdown.Critical} critical vulnerabilities in Docker image`;
            labels.push('critical');
          } else if (vulnerabilityBreakdown.High > 0) {
            title = `🔴 HIGH: ${vulnerabilityBreakdown.High} high severity vulnerabilities in Docker image`;
            labels.push('high');
          } else if (realVulnerabilities > 0) {
            title = `⚠️ SECURITY: ${realVulnerabilities} vulnerabilities found in Docker image`;
            labels.push('security-vulnerabilities');
          } else if (dockerfileIssueCount > 0) {
            title = `📋 Dockerfile Security Scan: ${dockerfileIssueCount} configuration issues found`;
            labels.push('needs-attention');
          } else {
            title = `✅ Dockerfile Security Scan: No issues found`;
            labels.push('passed');
          }
          
          // Создаем детальный отчет об уязвимостях
          let vulnerabilityReport = `## 🛡️ Security Vulnerability Report\n\n`;
          
          vulnerabilityReport += `### 📊 Vulnerability Summary\n\n`;
          
          if (realVulnerabilities > 0) {
            vulnerabilityReport += `**Grype SBOM Scan:**\n`;
            vulnerabilityReport += `- Total matches: ${grypeVulnerabilities.length}\n`;
            vulnerabilityReport += `- Real vulnerabilities: ${realVulnerabilities}\n`;
            if (vulnerabilityBreakdown.Critical > 0) vulnerabilityReport += `- 🚨 Critical: ${vulnerabilityBreakdown.Critical}\n`;
            if (vulnerabilityBreakdown.High > 0) vulnerabilityReport += `- 🔴 High: ${vulnerabilityBreakdown.High}\n`;
            if (vulnerabilityBreakdown.Medium > 0) vulnerabilityReport += `- 🟡 Medium: ${vulnerabilityBreakdown.Medium}\n`;
            if (vulnerabilityBreakdown.Low > 0) vulnerabilityReport += `- 🔵 Low: ${vulnerabilityBreakdown.Low}\n`;
            if (vulnerabilityBreakdown.Unknown > 0) vulnerabilityReport += `- ⚪ Unknown: ${vulnerabilityBreakdown.Unknown}\n`;
            vulnerabilityReport += `\n`;
            
            // Trivy информация
            const trivyTotal = parseInt(process.env.TRIVY_TOTAL_COUNT) || 0;
            if (trivyTotal > 0) {
              vulnerabilityReport += `**Trivy Image Scan:**\n`;
              vulnerabilityReport += `- Total vulnerabilities: ${trivyTotal}\n`;
              const trivyCritical = parseInt(process.env.TRIVY_CRITICAL_COUNT) || 0;
              const trivyHigh = parseInt(process.env.TRIVY_HIGH_COUNT) || 0;
              const trivyMedium = parseInt(process.env.TRIVY_MEDIUM_COUNT) || 0;
              const trivyLow = parseInt(process.env.TRIVY_LOW_COUNT) || 0;
              if (trivyCritical > 0) vulnerabilityReport += `- CRITICAL: ${trivyCritical}\n`;
              if (trivyHigh > 0) vulnerabilityReport += `- HIGH: ${trivyHigh}\n`;
              if (trivyMedium > 0) vulnerabilityReport += `- MEDIUM: ${trivyMedium}\n`;
              if (trivyLow > 0) vulnerabilityReport += `- LOW: ${trivyLow}\n`;
              vulnerabilityReport += `\n`;
            }
            
            // Security Gates Status
            vulnerabilityReport += `### 🔒 Security Gates Status:\n\n`;
            if (buildSuccess === 'false') {
              vulnerabilityReport += `❌ **Failed** - Docker build failed\n`;
            } else if (dockerfileCriticalCount > 0) {
              vulnerabilityReport += `❌ **Failed** - Critical Dockerfile issues found\n`;
            } else if (vulnerabilityBreakdown.Critical > 0) {
              vulnerabilityReport += `❌ **Failed** - Critical vulnerabilities found\n`;
            } else {
              vulnerabilityReport += `✅ **Passed** - No critical issues found\n`;
            }
            vulnerabilityReport += `✅ **Passed** - Docker build successful\n\n`;
            
            // ОГРАНИЧИВАЕМ количество уязвимостей в issue (первые 10)
            const maxVulnerabilitiesInIssue = 10;
            const vulnerabilitiesToShow = grypeVulnerabilities.slice(0, maxVulnerabilitiesInIssue);
            const remainingVulnerabilities = grypeVulnerabilities.length - maxVulnerabilitiesInIssue;

            if (grypeVulnerabilities.length > 0) {
              vulnerabilityReport += `### 🔍 Top ${vulnerabilitiesToShow.length} Vulnerabilities\n\n`;
              
              if (remainingVulnerabilities > 0) {
                vulnerabilityReport += `*Showing ${vulnerabilitiesToShow.length} of ${grypeVulnerabilities.length} vulnerabilities. ${remainingVulnerabilities} more in detailed reports.*\n\n`;
              }
              
              vulnerabilitiesToShow.forEach((match, index) => {
                const vuln = match.vulnerability;
                const artifact = match.artifact;
                const severity = vuln.severity || 'Unknown';
                
                // Эмодзи для severity
                const severityEmoji = {
                  'Critical': '🚨',
                  'High': '🔴', 
                  'Medium': '🟡',
                  'Low': '🔵',
                  'Unknown': '⚪',
                  'None': '⚫'
                }[severity] || '⚪';
                
                vulnerabilityReport += `<details>\n`;
                vulnerabilityReport += `<summary><b>${index + 1}. ${vuln.id}</b> ${severityEmoji} ${severity} - ${artifact.name}@${artifact.version}</summary>\n\n`;
                
                vulnerabilityReport += `**Package:** \`${artifact.name}@${artifact.version}\`\n\n`;
                vulnerabilityReport += `**Description:** ${vuln.description || 'No description available'}\n\n`;
                
                // CVSS INFORMATION
                if (vuln.cvss && vuln.cvss.length > 0) {
                  const primaryCvss = vuln.cvss.find(c => c.type === 'Primary') || vuln.cvss[0];
                  vulnerabilityReport += `**CVSS Score:** ${primaryCvss.metrics.baseScore}/10\n`;
                  
                  if (primaryCvss.vector) {
                    vulnerabilityReport += `**Vector:** \`${primaryCvss.vector}\`\n`;
                  }
                  vulnerabilityReport += `\n`;
                }
                
                // EPSS если доступно
                if (vuln.epss && vuln.epss.length > 0) {
                  const epss = vuln.epss[0];
                  const epssPercent = (epss.epss * 100).toFixed(2);
                  const percentile = (epss.percentile * 100).toFixed(2);
                  vulnerabilityReport += `**EPSS:** ${epssPercent}% (more exploitable than ${percentile}% of CVEs)\n\n`;
                }
                
                // References
                if (vuln.urls && vuln.urls.length > 0) {
                  vulnerabilityReport += `**[View Details](${vuln.urls[0]})**\n`;
                }
                
                vulnerabilityReport += `</details>\n\n`;
              });
            }
          } else {
            vulnerabilityReport += `### ✅ No Vulnerabilities Found\n\n`;
            vulnerabilityReport += `Security scanners did not find any vulnerabilities in the Docker image.\n\n`;
            
            // Security Gates Status
            vulnerabilityReport += `### 🔒 Security Gates Status:\n\n`;
            if (buildSuccess === 'false') {
              vulnerabilityReport += `❌ **Failed** - Docker build failed\n`;
            } else if (dockerfileCriticalCount > 0) {
              vulnerabilityReport += `❌ **Failed** - Critical Dockerfile issues found\n`;
            } else {
              vulnerabilityReport += `✅ **Passed** - All security gates passed\n`;
            }
            vulnerabilityReport += `✅ **Passed** - Docker build successful\n\n`;
          }

          // Информация о файлах с детальными отчетами
          vulnerabilityReport += `### 📁 Detailed Reports in Artifacts\n\n`;
          vulnerabilityReport += `For complete technical details, download these files from workflow artifacts:\n\n`;
          
          vulnerabilityReport += `#### 🔍 Vulnerability Analysis\n`;
          vulnerabilityReport += `| File | Description |\n`;
          vulnerabilityReport += `|------|-------------|\n`;
          vulnerabilityReport += `| \`analysis-results.md\` | Main security analysis with Dockerfile issues |\n`;
          vulnerabilityReport += `| \`sbom-scan-all-severities.json\` | Complete Grype scan results (JSON) |\n`;
          vulnerabilityReport += `| \`trivy-results-all-severities.json\` | Complete Trivy scan results (JSON) |\n`;
          vulnerabilityReport += `| \`trivy-report.txt\` | Trivy text report |\n`;
          vulnerabilityReport += `| \`hadolint-results.json\` | Dockerfile linter results |\n`;
          vulnerabilityReport += `\n`;
          
          vulnerabilityReport += `#### 📦 Software Bill of Materials\n`;
          vulnerabilityReport += `| File | Description |\n`;
          vulnerabilityReport += `|------|-------------|\n`;
          vulnerabilityReport += `| \`sbom.cyclonedx.json\` | Component list (CycloneDX format) |\n`;
          vulnerabilityReport += `\n`;
          
          vulnerabilityReport += `#### 🐳 Docker Image\n`;
          vulnerabilityReport += `| File | Description |\n`;
          vulnerabilityReport += `|------|-------------|\n`;
          vulnerabilityReport += `| \`docker-image-${{ github.sha }}.tar.gz\` | Docker image archive |\n`;
          vulnerabilityReport += `| \`build-results.json\` | Build process results |\n`;
          vulnerabilityReport += `\n`;
          
          vulnerabilityReport += `**To download:** Go to Actions → This workflow → Artifacts\n\n`;
          
          const detailedReport = `${report}
          
          ${vulnerabilityReport}
          
          ---
          *Automatically generated by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*
          `;
          
          // Ищем существующий issue
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['dockerfile-security']
          });
          
          const existingIssue = issues.find(issue => 
            issue.title.includes('Dockerfile Security') || 
            issue.title.includes('Docker Build Failed')
          );
          
          let issueNumber;
          
          if (existingIssue) {
            // Обновляем существующий issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              title: title,
              body: detailedReport
            });
            issueNumber = existingIssue.number;
            console.log(`Updated existing issue #${existingIssue.number}`);
          } else {
            // Создаем новый issue
            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: detailedReport,
              labels: labels
            });
            issueNumber = newIssue.number;
            console.log(`Created new issue #${newIssue.number}`);
          }
          
    - name: Close existing issue if no problems
      uses: actions/github-script@v6
      if: steps.analysis.outputs.dockerfile_issue_count == 0 && steps.analysis.outputs.sbom_real_vuln_count == 0 && steps.build.outputs.build_success == 'true'
      env:
        DOCKERFILE_ISSUE_COUNT: ${{ steps.analysis.outputs.dockerfile_issue_count }}
        SBOM_REAL_VULN_COUNT: ${{ steps.analysis.outputs.sbom_real_vuln_count }}
      with:
        script: |
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['dockerfile-security'],
            sort: 'created',
            direction: 'desc'
          });

          for (const issue of issues) {
            // Закрываем только security issues созданные этим workflow
            if (issue.title.includes('Dockerfile Security Scan') && 
                !issue.title.includes('CRITICAL') && 
                !issue.title.includes('HIGH') &&
                !issue.title.includes('SECURITY') &&
                !issue.title.includes('Docker Build Failed')) {
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Automatically closed**: No issues detected in latest scan.\n\n- Scan date: ${new Date().toISOString()}\n- Commit: ${context.sha}\n- Dockerfile issues: ${process.env.DOCKERFILE_ISSUE_COUNT}\n- Security vulnerabilities: ${process.env.SBOM_REAL_VULN_COUNT}`
              });

              console.log(`✅ Closed issue #${issue.number} - no issues found`);
            }
          }
          
    - name: Post PR comment
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      env:
        DOCKERFILE_ISSUE_COUNT: ${{ steps.analysis.outputs.dockerfile_issue_count }}
        DOCKERFILE_CRITICAL_COUNT: ${{ steps.analysis.outputs.dockerfile_critical_count }}
        BUILD_SUCCESS: ${{ steps.build.outputs.build_success }}
        SECURITY_GATES_PASSED: ${{ steps.security_gates.outputs.security_gates_passed }}
        SBOM_REAL_VULN_COUNT: ${{ steps.analysis.outputs.sbom_real_vuln_count }}
        SBOM_CRITICAL_COUNT: ${{ steps.analysis.outputs.sbom_critical_count }}
        SBOM_HIGH_COUNT: ${{ steps.analysis.outputs.sbom_high_count }}
      with:
        script: |
          const fs = require('fs');
          const report = fs.existsSync('analysis-results.md') 
            ? fs.readFileSync('analysis-results.md', 'utf8')
            : '## Dockerfile Analysis Results\n\nAnalysis results not available.';
          
          const dockerfileIssueCount = parseInt(process.env.DOCKERFILE_ISSUE_COUNT);
          const dockerfileCriticalCount = parseInt(process.env.DOCKERFILE_CRITICAL_COUNT);
          const buildSuccess = process.env.BUILD_SUCCESS;
          const securityGatesPassed = process.env.SECURITY_GATES_PASSED;
          const sbomRealVulnCount = parseInt(process.env.SBOM_REAL_VULN_COUNT);
          const sbomCriticalCount = parseInt(process.env.SBOM_CRITICAL_COUNT);
          const sbomHighCount = parseInt(process.env.SBOM_HIGH_COUNT);
          
          let commentTitle;
          if (buildSuccess === 'false') {
            commentTitle = '## 🚨 Dockerfile Security Scan - BUILD FAILED';
          } else if (dockerfileCriticalCount > 0 || sbomCriticalCount > 0) {
            commentTitle = '## 🚨 CRITICAL: Security Issues Found';
          } else if (dockerfileIssueCount > 0 || sbomHighCount > 0) {
            commentTitle = '## ⚠️ Security Issues Found';
          } else if (sbomRealVulnCount > 0) {
            commentTitle = '## ⚠️ Security Vulnerabilities Found';
          } else {
            commentTitle = '## ✅ Dockerfile Security Scan Passed';
          }
          
          const securityGatesStatus = securityGatesPassed === 'true' 
            ? '🟢 **Security Gates:** PASSED'
            : '🔴 **Security Gates:** FAILED';
          
          const commentBody = `${commentTitle}
          
          ${report}
          
          ${securityGatesStatus}
          
          *Automated security scan*`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: commentBody
          });
